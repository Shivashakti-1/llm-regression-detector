[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-regression-detector"
version = "0.1.0"
description = "Golden-dataset CI regression testing for LLM applications"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
llm-regression = "llm_regression.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
